<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="title">
  <title id="title">Intentando Coleccionar  logo con fondo</title>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Rubik+Dirt&amp;display=swap');
      .w1 {
        font-family: 'Rubik Dirt', Impact, sans-serif;
        font-size: 118px;
        fill: #ffffff;
        letter-spacing: 2px;
      }
      .w2 {
        font-family: 'Rubik Dirt', Impact, sans-serif;
        font-size: 62px;
        fill: #ffffff;
        letter-spacing: 4px;
      }
    </style>
    <pattern id="brick" width="64" height="32" patternUnits="userSpaceOnUse">
      <rect width="64" height="32" fill="#1a1816"/>
      <rect x="1" y="1" width="30" height="14" fill="#2c2926"/>
      <rect x="33" y="1" width="30" height="14" fill="#262320"/>
      <rect x="-15" y="17" width="30" height="14" fill="#2a2724"/>
      <rect x="17" y="17" width="30" height="14" fill="#302d2a"/>
      <rect x="49" y="17" width="30" height="14" fill="#242220"/>
    </pattern>
    <radialGradient id="vignette" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="70%" stop-color="#000000" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.82"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>
  <rect width="960" height="720" fill="url(#brick)"/>
  <rect width="960" height="720" fill="url(#vignette)"/>
  <g transform="translate(70 220) rotate(-5 400 120)" filter="url(#soft)">
    <text class="w1" x="0" y="100">INTENTANDO</text>
    <text class="w2" x="140" y="178">COLECCIONAR</text>
    <path fill="#fff" d="M70 112c1.2 14 0.4 26-1.4 40-0.6 4.5 3.2 5.2 4 1 2.6-13 3-25 1.6-41z"/>
    <path fill="#fff" d="M230 108c1 16 0.2 30-1.5 44-0.5 4.8 3.4 5.4 4 0.8 2.4-15 2.8-29 1.2-44.8z"/>
    <path fill="#fff" d="M470 106c1.3 18 0.2 34-1.8 50-0.6 5 3.6 5.6 4.2 0.6 2.8-17 3.2-33 1.4-50.6z"/>
  </g>
</svg>
